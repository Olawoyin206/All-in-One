<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All in One</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mainContainer">
        <div id="titleContainer">
            <h1 id="calculatorTitle">Calculator</h1>
            <h1 id="converterTitle">Converter</h1>
        </div>
        <div id="converterContainer">
            <div id="converterItems">
            <div class="converterRow">
                <div><i class="fa-solid fa-coins"></i> <p>Currency</p></div>
                <div><i class="fa-solid fa-ruler-horizontal"></i><p>Length</p></div>
                <div><i class="fa-solid fa-weight-scale"></i> <p>Mass</p></div>
            </div>

            <div class="converterRow">
                <div><i class="fa-regular fa-square"></i><p>Area</p></div>
                <div><i class="fa-solid fa-clock"></i> <p>Time</p></div>
                <div><i class="fa-solid fa-database"></i> <p>Data</p></div>
            </div>

            <div class="converterRow">
                <div><i class="fa-solid fa-tag"></i> <p>Discount</p></div>
                <div><i class="fa-solid fa-kaaba"></i> <p>Volume</p></div>
                <div><i class="fa-solid fa-hashtag"></i> <p>Numeral</p></div>
            </div>

            <div class="converterRow">
                <div><i class="fa-solid fa-tachometer-alt"></i> <p>Speed</p></div>
                <div><i class="fa-solid fa-thermometer-half"></i> <p>Temperature</p></div>
                <div><i class="fa-solid fa-weight"></i> <p>BMI</p></div>
            </div>
            </div>
        </div>
        <div id="calculatorContainer">
        <div id="inputContainer">
        <div  id="historyDisplay"></div>
        <input type="text" disabled id="inputDisplay" placeholder="0">
        <input type="text" disabled id="resultDisplay" >
        </div>
        <div id="buttonsContainer">
            
            <div class="buttonRow">
                <button  class="operatorBtn" id="clearBtn">AC</button>
                <button  class="operatorBtn" id="backspaceBtn">⌫</button>
                <button  class="operatorBtn" id="percentBtn">%</button>
                <button  class="operatorBtn" id="divideBtn">/</button>
            </div>

            <div class="buttonRow">
                <button  id="sevenBtn">7</button>
                <button  id="eightBtn">8</button>
                <button  id="nineBtn">9</button>
                <button  class="operatorBtn" id="multiplyBtn">*</button>
            </div>

            <div class="buttonRow">
                <button id="fourBtn">4</button>
                <button id="fiveBtn">5</button>
                <button id="sixBtn">6</button>
                <button class="operatorBtn" id="subtractBtn">-</button>
            </div>

            <div class="buttonRow">
                <button  id="oneBtn">1</button>
                <button  id="twoBtn">2</button>
                <button  id="threeBtn">3</button>
                <button  class="operatorBtn" id="addBtn">+</button>
            </div>

            <div class="buttonRow">
                <button  id="doublezeroBtn">00</button>
                <button  id="zeroBtn">0</button>
                <button  id="decimalBtn">.</button>
                <button  class="operatorBtn" id="equalsBtn">=</button>
            
        
            
        </div>
           
        </div>
        </div>
         <div id="madewithlove"><p>Made with ❤️</p></div>
    </div>
    
</body>
<script src="app.js"></script>
<script src="https://kit.fontawesome.com/a3c27a9b70.js" crossorigin="anonymous"></script>
</html>
